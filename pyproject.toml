[project]
name = "isic2024"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "WHO777", email = "ziv.ziv.29@gmail.com"},
]
dependencies = [
    "clearml>=1.16.2",
    "clearml-agent>=1.8.1",
    "setuptools>=72.1.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
    "lightning>=2.3.3",
    "h5py>=3.11.0",
    "pandas>=2.0.3",
    "Pillow>=10.4.0",
    "timm>=1.0.8",
    "albumentations>=1.4.13",
    "scikit-learn>=1.3.2",
]
requires-python = "==3.8.*"
readme = "README.md"

[project.optional-dependencies]
kaggle = [
    "kaggle>=1.6.17",
]
loggers = [
    "tensorboardX>=2.6.2.2",
]

[tool.pdm]
[tool.pdm.dev-dependencies]
lint_format = [
    "isort>=5.13.2",
    "ruff>=0.5.5",
]
type_check = [
    "mypy>=1.11.1",
]
